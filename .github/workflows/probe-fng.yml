name: probe-fng
on:
  push:
    branches: [probe-fng]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { ref: probe-fng, fetch-depth: 1 }
      - run: python3 probe/fng.py
      - run: |
          git config user.name "probe"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe/out && git commit -m "probe-fng results" && git push origin HEAD:probe-fng
