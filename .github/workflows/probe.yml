name: Probe (temporary)
on:
  push:
    branches: [probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Library and links
        timeout-minutes: 5
        run: |
          mkdir -p probe/out8
          bash probe/round8a.sh 2>&1 | tee probe/out8/log_a.txt || true
      - name: Save results (a)
        if: always()
        run: |
          git config user.name "DOG Monitor bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe/out8 && git commit -m "Probe results (a)" && git push origin HEAD:probe || true
      - name: Top-100 balances
        timeout-minutes: 14
        run: bash probe/round8b.sh 2>&1 | tee probe/out8/log_b.txt || true
      - name: Save results (b)
        if: always()
        run: |
          git add probe/out8 && git commit -m "Probe results (b)" && git push origin HEAD:probe || true
