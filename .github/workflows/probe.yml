name: Probe (temporary)
on:
  push:
    branches: [probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Server-side checks
        run: |
          mkdir -p probe/out6
          python3 -u probe/probe6.py all 2>&1 | tee probe/out6/log.txt || true
      - name: Save results
        run: |
          git config user.name "DOG Monitor bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe/out6 && git commit -m "Probe results" && git push origin HEAD:probe
