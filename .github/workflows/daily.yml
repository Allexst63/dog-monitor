name: Обновление DOG Монитора

on:
  schedule:
    # Полная сводка 4 раза в день. Время — UTC; GitHub запускает плановые задачи с задержкой 10–50 минут.
    # По времени UTC+1 (зимой) это примерно 7:30, 12:50, 17:50 и 22:20.
    - cron: '41 5 * * *'      # утренняя сводка (после неё — ежедневное сообщение)
    - cron: '11 11 * * *'     # днём
    - cron: '11 16 * * *'     # вечером
    - cron: '41 20 * * *'     # на ночь
  workflow_dispatch:
    inputs:
      mode:
        description: 'full — полная сводка; feed — только кандидаты в новости; wallets — только средние цены кошельков'
        default: full
        type: choice
        options: [full, feed, wallets]

permissions:
  contents: write

concurrency:
  group: dogmon-daily
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Сбор данных и расчёт сводки
        if: ${{ github.event.inputs.mode != 'feed' && github.event.inputs.mode != 'wallets' }}
        env:
          DOGMON: ${{ runner.temp }}/dogmon
          # утро — утренняя сводка, база — плановая сводка в течение дня, запрос — запуск вручную
          DOGMON_KIND: ${{ github.event_name != 'schedule' && 'запрос' || github.event.schedule == '41 5 * * *' && 'утро' || 'база' }}
        run: python3 tools/daily.py run .

      - name: Средняя цена DOG у кошельков топ-100, история цены DOG и биткоина
        if: ${{ github.event.inputs.mode != 'feed' }}
        continue-on-error: true      # не мешает сводке: при ошибке остаётся прошлый расчёт
        timeout-minutes: 12
        run: python3 tools/costbasis.py .

      - name: Страх и жадность (весь рынок — alternative.me, DOG — свой расчёт)
        if: ${{ github.event.inputs.mode != 'feed' }}
        continue-on-error: true      # при ошибке на сайте остаётся прошлый расчёт
        timeout-minutes: 3
        run: python3 tools/mood.py .

      - name: Кандидаты в новости (Google News)
        if: ${{ github.event.inputs.mode != 'wallets' }}
        continue-on-error: true
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: python3 tools/newsfeed.py data/feed.json 7

      - name: Автопроверка сайта в браузере (со свежими данными, до выкладки)
        id: selfcheck
        if: ${{ github.event.inputs.mode != 'feed' }}
        continue-on-error: true      # итог пишется в data/selfcheck.json и виден на сайте; сводку не задерживает
        timeout-minutes: 8
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw"
          npm init -y >/dev/null 2>&1
          npm i --no-audit --no-fund playwright-core@1.48.2 >/dev/null 2>&1
          cd "$GITHUB_WORKSPACE"
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node tools/selfcheck.js . data/selfcheck.json

      - name: Выкладка на сайт
        run: |
          git config user.name "DOG Monitor bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "нет изменений"; exit 0; fi
          ID=$(python3 -c "import json;print(json.load(open('data/version.json'))['id'])")
          git commit -m "Сводка $ID (авто, ${{ github.event.inputs.mode || 'full' }})"
          for i in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
          done
          exit 1

      - name: Проверка выкладки (живой сайт отдаёт новую сводку)
        if: ${{ github.event.inputs.mode != 'feed' && github.event.inputs.mode != 'wallets' }}
        timeout-minutes: 12
        run: python3 tools/livecheck.py . https://allexst63.github.io/dog-monitor/

      - name: Итог автопроверки
        if: ${{ always() && steps.selfcheck.outcome == 'failure' }}
        run: |
          echo "::error::Автопроверка сайта нашла проблемы — см. шаг «Автопроверка сайта в браузере» и data/selfcheck.json"
          exit 1

      - name: Сырые ответы источников (для проверки)
        if: ${{ always() && github.event.inputs.mode != 'feed' && github.event.inputs.mode != 'wallets' }}
        uses: actions/upload-artifact@v4
        with:
          name: raw-${{ github.run_id }}
          path: ${{ runner.temp }}/dogmon/raw
          retention-days: 7
