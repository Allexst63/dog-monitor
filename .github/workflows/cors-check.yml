name: CORS check (temporary)
on:
  push:
    branches: [cors-check]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Market snapshot
        run: bash tools/snap.sh
      - name: Save results to branch
        run: |
          git config user.name "DOG Monitor bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mk5 && git commit -m "Market snapshot" && git push origin HEAD:cors-check
