name: CORS check (temporary)
on:
  push:
    branches: [cors-check]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Macro and crypto market data
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
          NOW=$(date +%s)
          mkdir -p mk4
          get() { curl -s -m 40 -A "$UA" -H "Accept: application/json,text/html" -o "mk4/$1" -w "$1 %{http_code} %{size_download}\n" "$2" >> mk4/log.txt || echo "$1 ERR" >> mk4/log.txt; sleep 0.8; }
          get btc_ticker.json "https://api.exchange.coinbase.com/products/BTC-USD/ticker"
          get btc_d1a.json "https://api.exchange.coinbase.com/products/BTC-USD/candles?granularity=86400"
          get btc_d1b.json "https://api.exchange.coinbase.com/products/BTC-USD/candles?granularity=86400&start=$(date -u -d @$((NOW-600*86400)) +%FT%TZ)&end=$(date -u -d @$((NOW-300*86400)) +%FT%TZ)"
          get btc_h6.json "https://api.exchange.coinbase.com/products/BTC-USD/candles?granularity=21600"
          get btc_h1.json "https://api.exchange.coinbase.com/products/BTC-USD/candles?granularity=3600"
          get eth_d1.json "https://api.exchange.coinbase.com/products/ETH-USD/candles?granularity=86400"
          get kraken_btc_d1.json "https://api.kraken.com/0/public/OHLC?pair=XBTUSD&interval=1440"
          get dvol.json "https://www.deribit.com/api/v2/public/get_volatility_index_data?currency=BTC&start_timestamp=$(( (NOW-120*86400)*1000 ))&end_timestamp=$((NOW*1000))&resolution=86400"
          get deribit_opts.json "https://www.deribit.com/api/v2/public/get_book_summary_by_currency?currency=BTC&kind=option"
          get deribit_fut.json "https://www.deribit.com/api/v2/public/get_book_summary_by_currency?currency=BTC&kind=future"
          get deribit_index.json "https://www.deribit.com/api/v2/public/get_index_price?index_name=btc_usd"
          get deribit_funding.json "https://www.deribit.com/api/v2/public/get_funding_rate_history?instrument_name=BTC-PERPETUAL&start_timestamp=$(( (NOW-14*86400)*1000 ))&end_timestamp=$((NOW*1000))"
          get okx_funding.json "https://www.okx.com/api/v5/public/funding-rate-history?instId=BTC-USDT-SWAP&limit=100"
          get okx_oi.json "https://www.okx.com/api/v5/rubik/stat/contracts/open-interest-volume?ccy=BTC&period=1D"
          get okx_ls.json "https://www.okx.com/api/v5/rubik/stat/contracts/long-short-account-ratio?ccy=BTC&period=1D"
          get bybit_oi.json "https://api.bybit.com/v5/market/open-interest?category=linear&symbol=BTCUSDT&intervalTime=1d&limit=60"
          get bybit_funding.json "https://api.bybit.com/v5/market/funding/history?category=linear&symbol=BTCUSDT&limit=60"
          get binance_oi.json "https://fapi.binance.com/futures/data/openInterestHist?symbol=BTCUSDT&period=1d&limit=60"
          get binance_funding.json "https://fapi.binance.com/fapi/v1/fundingRate?symbol=BTCUSDT&limit=60"
          curl -s -m 40 -X POST -H "Content-Type: application/json" -d '{"type":"metaAndAssetCtxs"}' https://api.hyperliquid.xyz/info -o mk4/hl_ctx.json -w "hl_ctx %{http_code} %{size_download}\n" >> mk4/log.txt
          get fng.json "https://api.alternative.me/fng/?limit=120"
          for t in "%5EGSPC" "%5EIXIC" "DX-Y.NYB" "%5ETNX" "GC%3DF" "%5EVIX" "BTC-USD" "IBIT" "MSTR" "COIN"; do get "yf_$(echo $t | tr -dc 'A-Za-z0-9').json" "https://query1.finance.yahoo.com/v8/finance/chart/$t?range=1y&interval=1d"; done
          get dog_kraken_depth.json "https://api.kraken.com/0/public/Depth?pair=DOGUSD&count=500"
          get dog_gate_book.json "https://api.gateio.ws/api/v4/spot/order_book?currency_pair=DOG_USDT&interval=0.00001&limit=100"
          get dog_gate_ticker.json "https://api.gateio.ws/api/v4/spot/tickers?currency_pair=DOG_USDT"
          get dog_gate_d1.json "https://api.gateio.ws/api/v4/spot/candlesticks?currency_pair=DOG_USDT&interval=1d&limit=900"
          get dog_gate_h1.json "https://api.gateio.ws/api/v4/spot/candlesticks?currency_pair=DOG_USDT&interval=1h&limit=100"
          get dog_kraken_h1.json "https://api.kraken.com/0/public/OHLC?pair=DOGUSD&interval=60&since=$((NOW-5*86400))"
          get dog_digifinex.json "https://openapi.digifinex.com/v3/order_book?symbol=dog_usdt&limit=150"
          get dog_mexc.json "https://api.mexc.com/api/v3/depth?symbol=DOGUSDT&limit=1000"
          get dog_bingx.json "https://open-api.bingx.com/openApi/spot/v1/market/depth?symbol=DOG-USDT&limit=1000"
          get dog_gate_wallet.json "https://www.dogdata.xyz/api/address/bitcoin/bc1pk8g4rztfkxs2q9c40g6keeknjw6aadx3kzu4suzlll0remfw7xxs5x9ctv?limit=40"
          get dog_whales.json "https://www.dogdata.xyz/api/whale-alerts?threshold=5000000&limit=200"
          get dog_gate_trades.json "https://api.gateio.ws/api/v4/spot/trades?currency_pair=DOG_USDT&limit=1000"
          cat mk4/log.txt
      - name: Save results to branch
        run: |
          git config user.name "DOG Monitor bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mk4 && git commit -m "Market data refresh" && git push origin HEAD:cors-check
