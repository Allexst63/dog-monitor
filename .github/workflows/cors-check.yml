name: CORS check (temporary)
on:
  push:
    branches: [cors-check]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check CORS headers of public APIs
        run: |
          O="https://allexst63.github.io"
          urls=(
            "https://api.hiro.so/runes/v1/etchings/840000:3"
            "https://api.hiro.so/runes/v1/etchings/840000:3/holders?limit=60&offset=0"
            "https://api.hiro.so/runes/v1/etchings/840000:3/holders/bc1plzs2lltvv29k603w5m0aqma5e8w0n3pc77dt89l5w9hurmdfgd0swdhspn"
            "https://api.hiro.so/runes/v1/etchings/840000:3/activity?limit=5"
            "https://api.hiro.so/runes/v1/addresses/bc1plzs2lltvv29k603w5m0aqma5e8w0n3pc77dt89l5w9hurmdfgd0swdhspn/balances"
          )
          : > cors.txt
          for u in "${urls[@]}"; do
            code=$(curl -s -m 25 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36" -D h.txt -o b.txt -w '%{http_code}' -H "Origin: $O" "$u" || echo ERR)
            acao=$(grep -i '^access-control-allow-origin' h.txt | tr -d '\r' | head -1)
            acac=$(grep -i '^access-control-allow-credentials' h.txt | tr -d '\r' | head -1)
            ct=$(grep -i '^content-type' h.txt | tr -d '\r' | head -1)
            size=$(wc -c < b.txt)
            echo "$code | ${acao:-NO-ACAO} | ${acac} | ${ct} | ${size}B | $u" >> cors.txt
            head -c 700 b.txt | tr '\n' ' ' >> cors.txt; echo >> cors.txt
          done
          # preflight-free GET is enough for fetch() without custom headers
          cat cors.txt
      - name: Save results to branch
        run: |
          git config user.name "DOG Monitor bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cors.txt && git commit -m "CORS results" && git push origin HEAD:cors-check
