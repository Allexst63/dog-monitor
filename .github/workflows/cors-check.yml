name: CORS check (temporary)
on:
  push:
    branches: [cors-check]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check CORS headers of public APIs
        run: |
          O="https://allexst63.github.io"
          urls=(
            "https://www.dogdata.xyz/api/address/bitcoin/bc1plzs2lltvv29k603w5m0aqma5e8w0n3pc77dt89l5w9hurmdfgd0swdhspn?limit=1"
            "https://www.dogdata.xyz/api/airdrop/summary"
            "https://www.dogdata.xyz/api/multichain/stats"
            "https://www.dogdata.xyz/api/dog-rune/holders?page=2&limit=25"
            "https://www.mexc.com/open/api/v2/market/depth?symbol=DOG_USDT&depth=20"
            "https://api.mexc.com/api/v3/ticker/bookTicker?symbol=DOGUSDT"
            "https://www.mexc.com/api/platform/spot/market-v2/web/symbol/ticker?symbol=DOG_USDT"
            "https://open-api.bingx.com/openApi/spot/v1/ticker/24hr?symbol=DOG-USDT"
            "https://api.kraken.com/0/public/Trades?pair=DOGUSD&count=5"
            "https://api.gateio.ws/api/v4/spot/candlesticks?currency_pair=DOG_USDT&interval=1d&limit=5"
          )
          : > cors.txt
          for u in "${urls[@]}"; do
            code=$(curl -s -m 25 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36" -D h.txt -o b.txt -w '%{http_code}' -H "Origin: $O" "$u" || echo ERR)
            acao=$(grep -i '^access-control-allow-origin' h.txt | tr -d '\r' | head -1)
            acac=$(grep -i '^access-control-allow-credentials' h.txt | tr -d '\r' | head -1)
            ct=$(grep -i '^content-type' h.txt | tr -d '\r' | head -1)
            size=$(wc -c < b.txt)
            echo "$code | ${acao:-NO-ACAO} | ${acac} | ${ct} | ${size}B | $u" >> cors.txt
            head -c 160 b.txt | tr '\n' ' ' >> cors.txt; echo >> cors.txt
          done
          # preflight-free GET is enough for fetch() without custom headers
          cat cors.txt
      - name: Save results to branch
        run: |
          git config user.name "DOG Monitor bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cors.txt && git commit -m "CORS results" && git push origin HEAD:cors-check
