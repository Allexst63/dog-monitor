name: CORS check (temporary)
on:
  push:
    branches: [cors-check]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Address and trade details
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
          mkdir -p mk2
          get() { curl -s -m 40 -A "$UA" -o "mk2/$1.json" -w "$1 %{http_code} %{size_download}\n" "$2" >> mk2/log.txt || echo "$1 ERR" >> mk2/log.txt; sleep 1; }
          get gate_wallet "https://www.dogdata.xyz/api/address/bitcoin/bc1pk8g4rztfkxs2q9c40g6keeknjw6aadx3kzu4suzlll0remfw7xxs5x9ctv?limit=40"
          get rcv288 "https://www.dogdata.xyz/api/address/bitcoin/bc1pqp9s9276snfqsr4tacckhfuyqy2exaepgke79fl4nych88uezcss24hung?limit=20"
          get h65 "https://www.dogdata.xyz/api/address/bitcoin/bc1pedfq00ccwdnay0kv98697lcnq2ewars82cj3zucanlqynv9vzk7q98q9nq?limit=20"
          get h72 "https://www.dogdata.xyz/api/address/bitcoin/bc1pc4pxu7m3qa9jq4zel69nssksgq75jetyan2nwuguej3pwm50z83qsyhgug?limit=20"
          get gate_tr_28 "https://api.gateio.ws/api/v4/spot/trades?currency_pair=DOG_USDT&from=1793170800&to=1793174400&limit=1000"
          get gate_tr_30 "https://api.gateio.ws/api/v4/spot/trades?currency_pair=DOG_USDT&from=1793365200&to=1793368800&limit=1000"
          get whales_1m "https://www.dogdata.xyz/api/whale-alerts?threshold=1000000&limit=200"
          cat mk2/log.txt
      - name: Save results to branch
        run: |
          git config user.name "DOG Monitor bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mk2 && git commit -m "Address details" && git push origin HEAD:cors-check
