name: CORS check (temporary)
on:
  push:
    branches: [cors-check]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: End-to-end check of the live site in Chromium
        run: |
          npm init -y >/dev/null
          npm i playwright@1.48.2 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          sleep 45
          node e2e/run.js
          head -c 4000 e2e/result.json
      - name: Save results to branch
        run: |
          git config user.name "DOG Monitor bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e && git commit -m "E2E results" && git push origin HEAD:cors-check
